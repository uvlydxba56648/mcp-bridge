# MCP Bridge 跨平台打包:Windows exe / macOS app(universal)/ Linux AppImage
# 触发:推送 tag(v*)或手动 Actions 页面运行;产物在 Releases(draft)+ Artifacts
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: "" }
          - { os: ubuntu-22.04, target: "" }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Linux 系统依赖(仅 ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装前端依赖
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: 构建 + 打包(tauri-action 自动建 draft Release 并上传产物)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "MCP Bridge v__VERSION__"
          releaseDraft: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
