[package]
name = "bridge-core"
version = "0.1.0"
edition = "2021"
description = "MCP Bridge 核心:JetBrains MCP 探测、鉴权网关、cloudflared 托管(无 GUI 依赖)"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
tracing = "0.1"
rand = "0.8"
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false }

[dev-dependencies]
tracing-subscriber = "0.3"
